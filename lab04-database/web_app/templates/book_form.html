{% extends 'base.html' %}
{% block title %}{{ 'Редагування' if editing else 'Нова книга' }} · Електронна бібліотека{% endblock %}
{% block content %}
<section class="panel form-panel">
  <h1>{{ 'Редагувати видання' if editing else 'Додати видання' }}</h1>
  <form class="stack" method="post" data-book-form novalidate>
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>Назва<input name="title" maxlength="160" value="{{ book.get('title', '') }}" required></label>
    <label>ISBN<input name="isbn" inputmode="numeric" maxlength="13" pattern="[0-9]{13}" aria-describedby="isbn-hint" value="{{ book.get('isbn', '') }}" required></label>
    <small id="isbn-hint">13 цифр без пробілів і дефісів</small>
    <div class="fields">
      <label>Жанр<input name="genre" maxlength="80" value="{{ book.get('genre', '') }}" required></label>
      <label>Рік видання<input name="published_year" type="number" min="1450" max="2100" value="{{ book.get('published_year', '') }}" required></label>
    </div>
    <p class="notice error" data-validation role="alert" hidden></p>
    <div class="actions"><button>Зберегти</button><a class="btn outline" href="{{ url_for('index') }}">До каталогу</a></div>
  </form>
</section>
{% endblock %}

name: lab05
services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "timezone=UTC"]
    environment:
      POSTGRES_DB: library_lab05
      POSTGRES_USER: lab05
      POSTGRES_PASSWORD: "${LAB05_DB_PASSWORD:?Set LAB05_DB_PASSWORD in .env}"
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - library_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab05 -d library_lab05"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  library_data:
